# Copy this file to config.toml and edit it — config.toml is your own setup and is
# gitignored, config.example.toml is what ships with the repo.
#
# This example reproduces the original hardcoded setup: a UK computer science graduate
# hunting graduate/junior software engineering roles, based near Nottingham.

[settings]
# Optional path to a spreadsheet of roles already applied to, for extra dedupe.
# "" (or leave the JOBSEARCH_TRACKER env var unset) = skip tracker dedupe entirely.
# Setting the JOBSEARCH_TRACKER environment variable overrides this value, for people
# who prefer not to put a path in a config file.
tracker = ""
# 0-based column in the tracker sheet holding the company name.
tracker_company_column = 2
# Header rows to skip before reading tracker data.
tracker_skip_rows = 2
# Polite gap between portal requests, in seconds. Leave it there.
polite_delay_seconds = 1.5
# Per-query subprocess timeout, in seconds.
query_timeout_seconds = 120

[filters]
# Titles containing any of these are clearly above entry level and get dropped;
# everything else passes (broad CV: dev, web, data, QA roles all in scope).
# This is a blocklist, not a junior-only allowlist, deliberately: an allowlist drops
# perfectly applicable roles that just don't say "junior".
senior_words = [
    "senior", "lead", "principal", "staff", "head of", "manager",
    "director", "architect", "chief", "sr.", "sr ",
]

# Companies dropped entirely (case-insensitive substring match), seeded from the
# README's "Sources that waste your time" table — aggregators and CV harvesters that
# turn up in scrapes constantly and are not worth reviewing.
blocked_companies = [
    "Haystack", "Sundayy", "Helic & Co", "Hired", "DiverseJobsMatter", "Manchester Digital",
]

# name -> path to that portal CLI's entrypoint, relative to the repo root.
# reed, gradcracker and prospects ship with this repo and work standalone. linkedin and
# freehire come from the ai-job-search framework (README section 8); if you haven't
# installed it, queries using them are skipped with a warning, which is harmless.
[sources]
linkedin = ".agents/skills/linkedin-search/cli/src/cli.ts"   # framework only
reed = ".agents/skills/reed-search/cli/src/cli.ts"          # needs REED_API_KEY (user env var)
# Browse mode only in scheduled runs: robots.txt disallows /keyword-search, allows /search/*
gradcracker = ".agents/skills/gradcracker-search/cli/src/cli.ts"
# Uses Prospects' own public JSON endpoint (/api/jobs) — robots-allowed
prospects = ".agents/skills/prospects-search/cli/src/cli.ts"
freehire = ".agents/skills/freehire-search/cli/src/cli.ts"

# queries mirror .claude/skills/job-scraper/search-queries.md priorities — keep the two
# files in agreement when you change one.

[[queries]]
label = "LinkedIn Nottingham grad"
source = "linkedin"
args = ["search", "-q", "graduate software engineer",
        "-l", "Nottingham, England, United Kingdom", "--jobage", "1", "--limit", "15"]

[[queries]]
label = "LinkedIn UK grad SWE"
source = "linkedin"
args = ["search", "-q", "graduate software engineer",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "20"]

[[queries]]
label = "LinkedIn UK junior dev"
source = "linkedin"
args = ["search", "-q", "junior software developer",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "20"]

[[queries]]
label = "LinkedIn UK remote junior"
source = "linkedin"
args = ["search", "-q", "junior software engineer",
        "-l", "United Kingdom", "--remote", "remote", "--jobage", "1", "--limit", "15"]

[[queries]]
label = "LinkedIn UK software dev"
source = "linkedin"
args = ["search", "-q", "software developer",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "20"]

[[queries]]
label = "LinkedIn UK web/frontend"
source = "linkedin"
args = ["search", "-q", "web developer",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "20"]

[[queries]]
label = "LinkedIn UK fullstack"
source = "linkedin"
args = ["search", "-q", "full stack developer",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "20"]

[[queries]]
label = "LinkedIn UK data analyst"
source = "linkedin"
args = ["search", "-q", "data analyst",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "15"]

# Reed has no server-side age filter; --jobage filters client-side on posting date,
# so use a slightly wider window and let seen_jobs.json dedupe repeats

[[queries]]
label = "Reed UK grad SWE"
source = "reed"
args = ["search", "-q", "graduate software engineer", "--jobage", "3", "--limit", "50"]

[[queries]]
label = "Reed UK graduate-flag dev"
source = "reed"
args = ["search", "-q", "software developer", "--graduate", "--jobage", "3", "--limit", "50"]

[[queries]]
label = "Reed Nottingham 30mi"
source = "reed"
args = ["search", "-q", "software developer",
        "-l", "Nottingham", "--distance", "30", "--jobage", "5", "--limit", "50"]

[[queries]]
label = "Reed UK web dev"
source = "reed"
args = ["search", "-q", "web developer", "--jobage", "3", "--limit", "40"]

[[queries]]
label = "Reed UK data analyst"
source = "reed"
args = ["search", "-q", "data analyst", "--graduate", "--jobage", "3", "--limit", "40"]

# Gradcracker publishes deadlines not posting dates (date is always null);
# dedupe against seen_jobs.json is what surfaces the new listings each day

[[queries]]
label = "Gradcracker computing grads p1"
source = "gradcracker"
args = ["search", "--discipline", "computing-technology",
        "--type", "graduate-jobs", "--page", "1", "--limit", "40"]

[[queries]]
label = "Gradcracker computing grads p2"
source = "gradcracker"
args = ["search", "--discipline", "computing-technology",
        "--type", "graduate-jobs", "--page", "2", "--limit", "40"]

[[queries]]
label = "freehire GB junior"
source = "freehire"
args = ["search", "-q", "software engineer",
        "--country", "GB", "--seniority", "junior", "--jobage", "2", "--limit", "25"]

[[queries]]
label = "freehire GB fullstack junior"
source = "freehire"
args = ["search", "--category", "fullstack,backend,frontend",
        "--country", "GB", "--seniority", "junior", "--jobage", "2", "--limit", "25"]

# Prospects publishes closing dates, not posting dates (date is always null);
# sorted newest-first (default) and deduped against seen_jobs.json daily

[[queries]]
label = "Prospects grad SWE"
source = "prospects"
args = ["search", "-q", "software engineer", "--limit", "20"]

[[queries]]
label = "Prospects software dev"
source = "prospects"
args = ["search", "-q", "software developer", "--limit", "20"]

[[queries]]
label = "Prospects junior dev"
source = "prospects"
args = ["search", "-q", "junior developer", "--limit", "20"]
