# Public, role-agnostic example. Copy this file to config.toml, then replace the
# sample job titles and locations with your own. config.toml is gitignored.

[settings]
# Optional spreadsheet used to avoid companies already in your application tracker.
tracker = ""
# 0-based company-name column and number of header rows in your tracker.
tracker_company_column = 0
tracker_skip_rows = 1
polite_delay_seconds = 1.5
query_timeout_seconds = 120

[filters]
# Optional case-insensitive title exclusions. Empty means all seniority levels.
excluded_title_words = []
# Optional case-insensitive company exclusions. Each user should choose their own.
blocked_companies = []

[sources]
reed = ".agents/skills/reed-search/cli/src/cli.ts"
gradcracker = ".agents/skills/gradcracker-search/cli/src/cli.ts"
prospects = ".agents/skills/prospects-search/cli/src/cli.ts"

# These deliberately span different kinds of work. Replace or remove them before
# your first live run. Reed requires REED_API_KEY.

[[queries]]
label = "Reed project coordinator"
source = "reed"
args = ["search", "-q", "project coordinator", "--jobage", "7", "--limit", "25"]

[[queries]]
label = "Reed customer service"
source = "reed"
args = ["search", "-q", "customer service advisor", "--jobage", "7", "--limit", "25"]

[[queries]]
label = "Prospects marketing"
source = "prospects"
args = ["search", "-q", "marketing", "--limit", "20"]

[[queries]]
label = "Prospects finance"
source = "prospects"
args = ["search", "-q", "finance", "--limit", "20"]

# Browse all Gradcracker STEM disciplines instead of defaulting to computing.
[[queries]]
label = "Gradcracker all disciplines"
source = "gradcracker"
args = ["search", "--discipline", "all-disciplines", "--type", "graduate-jobs", "--limit", "30"]
