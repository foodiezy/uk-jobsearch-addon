# For a UK graduate hunting graduate/junior data analyst roles instead of software
# engineering ones. Copy to config.toml at the repo root and edit it.

[settings]
tracker = ""
tracker_company_column = 2
tracker_skip_rows = 2
polite_delay_seconds = 1.5
query_timeout_seconds = 120

[filters]
# Titles containing any of these are clearly above entry level and get dropped;
# everything else passes. This is a blocklist, not a junior-only allowlist,
# deliberately: an allowlist drops perfectly applicable roles that just don't say
# "junior".
senior_words = [
    "senior", "lead", "principal", "staff", "head of", "manager",
    "director", "architect", "chief", "sr.", "sr ",
]

# Companies dropped entirely (case-insensitive substring match) — aggregators and
# CV harvesters that turn up in scrapes constantly and are not worth reviewing.
blocked_companies = [
    "Haystack", "Sundayy", "Helic & Co", "Hired", "DiverseJobsMatter", "Manchester Digital",
]

# name -> path to that portal CLI's entrypoint, relative to the repo root.
# A source's CLI file not existing on disk is not fatal: any query using it is skipped
# with a warning, so you don't have to install every portal to use this file.
[sources]
linkedin = ".agents/skills/linkedin-search/cli/src/cli.ts"
reed = ".agents/skills/reed-search/cli/src/cli.ts"          # needs REED_API_KEY (user env var)
# Uses Prospects' own public JSON endpoint (/api/jobs) — robots-allowed
prospects = ".agents/skills/prospects-search/cli/src/cli.ts"
freehire = ".agents/skills/freehire-search/cli/src/cli.ts"

[[queries]]
label = "LinkedIn UK grad data analyst"
source = "linkedin"
args = ["search", "-q", "graduate data analyst",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "20"]

[[queries]]
label = "LinkedIn UK junior data analyst"
source = "linkedin"
args = ["search", "-q", "junior data analyst",
        "-l", "United Kingdom", "--jobage", "1", "--limit", "20"]

[[queries]]
label = "LinkedIn UK remote data analyst"
source = "linkedin"
args = ["search", "-q", "data analyst",
        "-l", "United Kingdom", "--remote", "remote", "--jobage", "1", "--limit", "15"]

# Reed has no server-side age filter; --jobage filters client-side on posting date,
# so use a slightly wider window and let seen_jobs.json dedupe repeats

[[queries]]
label = "Reed UK data analyst"
source = "reed"
args = ["search", "-q", "data analyst", "--jobage", "3", "--limit", "50"]

[[queries]]
label = "Reed UK graduate-flag data analyst"
source = "reed"
args = ["search", "-q", "data analyst", "--graduate", "--jobage", "3", "--limit", "50"]

[[queries]]
label = "Reed Nottingham data analyst 30mi"
source = "reed"
args = ["search", "-q", "data analyst",
        "-l", "Nottingham", "--distance", "30", "--jobage", "5", "--limit", "50"]

# Prospects publishes closing dates, not posting dates (date is always null);
# sorted newest-first (default) and deduped against seen_jobs.json daily

[[queries]]
label = "Prospects data analyst"
source = "prospects"
args = ["search", "-q", "data analyst", "--limit", "20"]

[[queries]]
label = "Prospects junior data analyst"
source = "prospects"
args = ["search", "-q", "junior data analyst", "--limit", "20"]

[[queries]]
label = "freehire GB data analyst"
source = "freehire"
args = ["search", "-q", "data analyst", "--country", "GB", "--jobage", "2", "--limit", "25"]
