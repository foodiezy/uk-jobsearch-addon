name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run job_scraper tests
        run: python -m unittest discover job_scraper/tests

  cli-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli: [reed-search, gradcracker-search, prospects-search]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: .agents/skills/${{ matrix.cli }}/cli
        run: bun install
      - name: Run tests
        working-directory: .agents/skills/${{ matrix.cli }}/cli
        # RUN_LIVE_TESTS is deliberately not set: the suites that make real requests to
        # job boards skip themselves here. CI stays offline, deterministic, and doesn't
        # scrape third-party sites on every push.
        run: bun run test
